name: Build Kula Today

on:
  schedule:
    # Every 30 minutes, 06:00-18:30 HST (UTC-10, no daylight saving).
    - cron: "*/30 16-23,0-4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "template.html", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the forecast code (private)
        uses: actions/checkout@v4
        with:
          repository: aukaka-9898/KulaModel
          token: ${{ secrets.KULAMODEL_TOKEN }}
          path: KulaModel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pandas requests

      - name: Build the page
        run: python build.py
        env:
          KULAMODEL: ${{ github.workspace }}/KulaModel
          HCDP_API_TOKEN: ${{ secrets.HCDP_API_TOKEN }}

      - name: Publish
        run: |
          git config user.name "kula-today bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update page"
          git push
