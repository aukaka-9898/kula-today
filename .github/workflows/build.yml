name: Build Kula Today

on:
  schedule:
    # Every 15 minutes, 06:07-18:52 HST (UTC-10, no daylight saving).
    # Off the quarter hours: GitHub delays or drops scheduled runs at busy
    # times, and on the quarter hours none ran at all on 2026-10-12.
    - cron: "7,22,37,52 16-23,0-4 * * *"
    # Hourly overnight, 19:07-05:07 HST, to keep the forecast current.
    - cron: "7 5-15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "patterns.py", "template.html", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Latest main with full history, not the shallow triggering commit: a
      # queued build, or a code push landing mid-build, left Publish unable to
      # rebase ("Run failed" emails, 12 runs 2026-10-12..17, all at Publish).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the forecast code (private)
        uses: actions/checkout@v4
        with:
          repository: aukaka-9898/KulaModel
          token: ${{ secrets.KULAMODEL_TOKEN }}
          path: KulaModel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pandas requests

      - name: Build the page
        run: python build.py
        env:
          KULAMODEL: ${{ github.workspace }}/KulaModel
          HCDP_API_TOKEN: ${{ secrets.HCDP_API_TOKEN }}

      - name: Publish
        run: |
          git config user.name "kula-today bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m "Update page"
          # A code push can land while this build runs; take it, then push.
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1
